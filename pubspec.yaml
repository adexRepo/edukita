name: edukita
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_bloc: ^9.1.1
  intl: any
  shared_preferences: any
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^0.4.0
  path: ^1.8.3
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.1.0
  uuid: ^4.5.3
  sqflite_common: ^2.5.6
  window_manager: ^0.5.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  get_it: ^9.2.1
  go_router: ^17.2.2
  carousel_slider: ^5.1.2
  fl_chart: ^1.2.0
  file_selector: ^1.0.4
  desktop_drop: ^0.6.0
  crypto: ^3.0.6
  package_info_plus: ^8.3.1
  shadcn_ui: ^0.55.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  freezed: ^3.2.5
  json_serializable: ^6.13.1
flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/PoppinsRegular-B2Bw.otf
        - asset: assets/fonts/poppins/PoppinsMedium-1JPv.otf
          weight: 500
        - asset: assets/fonts/poppins/PoppinsBold-GdJA.otf
          weight: 700
